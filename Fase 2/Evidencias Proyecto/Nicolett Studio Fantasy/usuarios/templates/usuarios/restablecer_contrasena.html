<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Nicolett Studio Fantasy</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f4; color: #2a2320; font-family: Arial, sans-serif; }
        main { width: min(440px, calc(100% - 40px)); padding: 32px; box-sizing: border-box; background: #fff; border: 1px solid #e8e0da; }
        h1 { margin: 0 0 12px; font-family: Georgia, serif; }
        p { color: #7a6e6a; line-height: 1.6; }
        label { display: block; margin: 18px 0 7px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #e8e0da; background: #faf7f4; }
        button { width: 100%; margin-top: 18px; padding: 13px; border: 0; background: #2a2320; color: #faf7f4; cursor: pointer; }
        .notice { padding: 12px; background: #f2ece7; color: #2a2320; line-height: 1.5; }
        .error { background: #f8d7da; color: #721c24; }
        a { color: #7a6e6a; }
    </style>
</head>
<body>
    <main>
        <h1>Nueva contraseña</h1>
        {% if exito %}
            <div class="notice" role="status">Tu contraseña se actualizó correctamente.</div>
            <p><a href="{% url 'login' %}">Iniciar sesión</a></p>
        {% elif token_valido %}
            <p>Elige una contraseña nueva para tu cuenta.</p>
            {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <label for="password">Nueva contraseña</label>
                <input id="password" type="password" name="password" autocomplete="new-password" required>
                <label for="password-confirm">Confirma la contraseña</label>
                <input id="password-confirm" type="password" name="password_confirm" autocomplete="new-password" required>
                <button type="submit">Guardar contraseña</button>
            </form>
        {% else %}
            <div class="notice error" role="alert">{{ error }}</div>
            <p><a href="{% url 'password_recovery' %}">Solicitar otro enlace</a></p>
        {% endif %}
    </main>
</body>
</html>
