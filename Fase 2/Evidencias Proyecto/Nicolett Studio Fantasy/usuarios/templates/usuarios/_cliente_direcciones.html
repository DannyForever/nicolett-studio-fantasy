    <div class="grid w-full gap-6">
        <section class="border border-[#ead7bc] bg-white p-6 shadow-sm sm:p-8" aria-labelledby="shipping-address-title">
            <h2 id="shipping-address-title" class="font-serif text-2xl">Direcciones de envío</h2>
            <p class="mt-2 text-sm leading-relaxed text-[#6b5643]">Aquí aparecerán las direcciones que uses para tus pedidos.</p>
            <div class="mt-6 border border-dashed border-[#ead7bc] bg-[#fffaf5] px-5 py-7 text-center">
                <i class="fa-solid fa-location-dot text-xl text-[#bd8c43]" aria-hidden="true"></i>
                <p class="mt-3 text-sm text-[#6b5643]">Aún no tienes direcciones de envío guardadas.</p>
                <button type="button" data-address-coming-soon class="mt-5 border border-[#5a3e27] px-5 py-3 text-xs font-medium uppercase tracking-wider text-[#5a3e27] transition hover:bg-[#5a3e27] hover:text-white">
                    Agregar información de envío
                </button>
                <p class="mt-3 text-xs text-[#6b5643]" data-address-status role="status" aria-live="polite" hidden></p>
            </div>
        </section>

        <section class="border border-[#ead7bc] bg-white p-6 shadow-sm sm:p-8" aria-labelledby="billing-address-title">
            <h2 id="billing-address-title" class="font-serif text-2xl">Direcciones de facturación</h2>
            <p class="mt-2 text-sm leading-relaxed text-[#6b5643]">Aquí aparecerán tus datos de facturación cuando decidas agregarlos.</p>
            <div class="mt-6 border border-dashed border-[#ead7bc] bg-[#fffaf5] px-5 py-7 text-center">
                <i class="fa-regular fa-file-lines text-xl text-[#bd8c43]" aria-hidden="true"></i>
                <p class="mt-3 text-sm text-[#6b5643]">Aún no tienes información de facturación guardada.</p>
                <button type="button" data-address-coming-soon class="mt-5 border border-[#5a3e27] px-5 py-3 text-xs font-medium uppercase tracking-wider text-[#5a3e27] transition hover:bg-[#5a3e27] hover:text-white">
                    Agregar información de facturación
                </button>
                <p class="mt-3 text-xs text-[#6b5643]" data-address-status role="status" aria-live="polite" hidden></p>
            </div>
        </section>
    </div>
    <script>
        document.querySelectorAll('[data-address-coming-soon]').forEach(button => {
            button.addEventListener('click', () => {
                const status = button.parentElement.querySelector('[data-address-status]');
                status.textContent = 'Esta opción estará disponible próximamente.';
                status.hidden = false;
            });
        });
    </script>
