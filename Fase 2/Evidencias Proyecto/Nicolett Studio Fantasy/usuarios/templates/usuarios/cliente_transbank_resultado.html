{% extends 'usuarios/cliente_base.html' %}

{% block title %}{{ titulo }} | Nicolett Studio Fantasy{% endblock %}

{% block content %}
    <section class="mx-auto max-w-2xl border border-[#ead7bc] bg-white p-6 text-center shadow-sm sm:p-8">
        <i class="fa-solid fa-circle-exclamation text-4xl text-[#8b5e28]" aria-hidden="true"></i>
        <h1 class="mt-4 font-serif text-2xl">{{ titulo }}</h1>
        <p class="mt-3 text-sm leading-relaxed text-[#6b5643]">{{ mensaje }}</p>
        <a href="{% url 'cliente_carrito' %}" class="mt-6 inline-block bg-[#5a3e27] px-5 py-3 text-sm font-medium text-white no-underline">
            Volver al carrito
        </a>
    </section>
{% endblock %}
